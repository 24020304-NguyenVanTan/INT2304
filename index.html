<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2-Player Chess (playhtml)</title>

<!-- chess.js: move generation/validation + game state (classic global build) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 2rem 1rem;
    background: #f4f1ea;
    color: #2b2b2b;
  }
  h1 { margin-bottom: 0.25rem; }
  #status {
    font-size: 1.1rem;
    margin-bottom: 1rem;
    min-height: 1.5em;
    font-weight: 600;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(8, min(11vw, 60px));
    grid-template-rows: repeat(8, min(11vw, 60px));
    border: 4px solid #3b2f2f;
    user-select: none;
    cursor: pointer;
  }
  .square {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(8vw, 42px);
    line-height: 1;
  }
  .light { background: #eeeed2; }
  .dark  { background: #769656; }
  .selected { outline: 4px solid #f7d51d; outline-offset: -4px; }
  .legal::after {
    content: "";
    display: block;
    width: 22%;
    height: 22%;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.25);
  }
  #reset {
    margin-top: 1rem;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #3b2f2f;
    background: white;
  }
  p.hint { max-width: 480px; text-align: center; color: #555; font-size: 0.9rem; }
</style>
</head>
<body>

<h1>♟️ 2-Player Chess</h1>
<p class="hint">
  Share this page's URL with your opponent — anyone who opens it joins the same
  game. It's White's move first; click a piece, then click a square to move it.
  Only the side whose turn it is can move.
</p>

<div id="status"></div>

<!-- can-play turns this wrapper into a synced, collaborative element via playhtml.
     The board grid and the reset button both live inside it so both can use
     the same onClick/setData wiring. -->
<div id="board-wrap" can-play>
  <div id="board"></div>
  <button id="reset" data-action="reset">Reset game</button>
</div>

<script>
  const wrapEl = document.getElementById("board-wrap");
  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");

  const FILES = ["a", "b", "c", "d", "e", "f", "g", "h"];
  const START_FEN = "start"; // chess.js accepts "start" as shorthand

  const PIECE_UNICODE = {
    wp: "♙", wn: "♘", wb: "♗", wr: "♖", wq: "♕", wk: "♔",
    bp: "♟", bn: "♞", bb: "♝", br: "♜", bq: "♛", bk: "♚",
  };

  function gameFromFen(fen) {
    const game = new Chess();
    if (fen && fen !== START_FEN) game.load(fen);
    return game;
  }

  function statusText(game) {
    if (game.in_checkmate()) {
      return `Checkmate — ${game.turn() === "w" ? "Black" : "White"} wins! (click "Reset game" to play again)`;
    }
    if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
      return "Draw.";
    }
    const side = game.turn() === "w" ? "White" : "Black";
    return game.in_check() ? `${side} to move — check!` : `${side} to move`;
  }

  // Renders the DOM from the shared data. Called on load and whenever
  // the synced data changes (locally or from the other player).
  function render(data) {
    const game = gameFromFen(data.fen);
    const legalTargets = data.selected
      ? game.moves({ square: data.selected, verbose: true }).map((m) => m.to)
      : [];

    boardEl.innerHTML = "";
    for (let rank = 8; rank >= 1; rank--) {
      for (let fileIdx = 0; fileIdx < 8; fileIdx++) {
        const square = FILES[fileIdx] + rank;
        const sq = document.createElement("div");
        sq.dataset.square = square;
        sq.className =
          "square " + ((fileIdx + rank) % 2 === 0 ? "dark" : "light");
        if (square === data.selected) sq.classList.add("selected");
        if (legalTargets.includes(square)) sq.classList.add("legal");

        const piece = game.get(square);
        if (piece) sq.textContent = PIECE_UNICODE[piece.color + piece.type];

        boardEl.appendChild(sq);
      }
    }
    statusEl.textContent = statusText(game);
  }

  // --- playhtml "can-play" wiring ---
  // IMPORTANT: this must be set *before* the playhtml script below runs.
  wrapEl.defaultData = { fen: START_FEN, selected: null };

  wrapEl.updateElement = ({ data }) => render(data);

  wrapEl.onClick = (e, { data, setData }) => {
    // Reset button, also inside this can-play element.
    if (e.target.closest('[data-action="reset"]')) {
      setData({ fen: START_FEN, selected: null });
      return;
    }

    const squareEl = e.target.closest(".square");
    if (!squareEl) return;
    const square = squareEl.dataset.square;

    const game = gameFromFen(data.fen);
    if (game.game_over()) return;

    // Nothing selected yet: select a piece belonging to the side to move.
    if (!data.selected) {
      const piece = game.get(square);
      if (piece && piece.color === game.turn()) {
        setData({ ...data, selected: square });
      }
      return;
    }

    // Clicking the same square deselects.
    if (square === data.selected) {
      setData({ ...data, selected: null });
      return;
    }

    // Try to make the move (auto-queen on promotion, kept minimal).
    const move = game.move({ from: data.selected, to: square, promotion: "q" });
    if (move) {
      setData({ fen: game.fen(), selected: null });
      return;
    }

    // Illegal target: if it's another of the mover's own pieces, re-select it.
    const piece = game.get(square);
    if (piece && piece.color === game.turn()) {
      setData({ ...data, selected: square });
    } else {
      setData({ ...data, selected: null });
    }
  };
</script>

<!-- playhtml: syncs and persists the board's data across everyone viewing this page -->
<script type="module">
  import { playhtml } from "https://unpkg.com/playhtml@latest";
  playhtml.init();
</script>

</body>
</html>
